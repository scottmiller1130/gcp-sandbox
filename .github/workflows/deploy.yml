name: Deploy

# Build once, then promote the same image (by digest) through environments:
#
#   build ──► dev (direct, smoke-tested) ──► prod (strategy you choose)
#
# Prod only starts if dev succeeded. Pushes to main run the full path with a
# canary in prod.
#
#   canary      shift traffic in steps (default 10 -> 50 -> 100), checking the
#               new revision's error rate at each step; roll back on failure
#   blue-green  stop with the new revision ("green") live on its own URL at 0%;
#               run Promote to cut over, Rollback to undo
#   direct      straight to 100% after the smoke test
on:
  push:
    branches: [main]
    paths: [app/**, scripts/**, .github/workflows/deploy.yml, .github/workflows/_release.yml]
  workflow_dispatch:
    inputs:
      target:
        description: How far to go
        type: choice
        options: [prod, dev]
        default: prod
      strategy:
        description: Release strategy in the last environment (dev always goes direct on the way to prod)
        type: choice
        options: [canary, blue-green, direct]
        default: canary
      canary_steps:
        description: Canary traffic steps (percent, space separated, must end in 100)
        default: "10 50 100"
      error_rate:
        description: "Make the new revision fail this fraction of requests (0-1), in the last environment only. Try 0.1 to watch a canary abort, 1 to watch the smoke test block it."
        default: "0"

permissions:
  contents: read
  id-token: write
  attestations: read # each release checks the image's build provenance
  pull-requests: read # the change ledger records the PR and its approvals
  actions: read       # ...and who approved the deployment

# One release at a time: two overlapping canaries would fight over the same
# traffic split. A later push waits for the running release, never cancels it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write # sign the image's build provenance
    outputs:
      image: ${{ steps.push.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    env:
      IMAGE: ${{ vars.GCP_AR_REPO }}/hello-web
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: app/go.mod
          cache: false
      - name: Test
        working-directory: app
        run: go test -race -count=1 ./...

      - id: version
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.CI_BUILDER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push
        id: push
        working-directory: app
        run: |
          # Tags are immutable in the registry, so each build gets its own:
          # re-running a deploy for the same commit can't collide.
          tag="$IMAGE:${{ steps.version.outputs.version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --build-arg VERSION=${{ steps.version.outputs.version }} -t "$tag" .
          docker push "$tag"
          # Deploy by digest: the exact bytes that were tested, in every environment.
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")
          echo "image=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      # Signed SLSA build provenance: which commit and workflow built these
      # exact bytes. Kept on GitHub (Sigstore-signed); every release checks it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}

  dev:
    needs: build
    uses: ./.github/workflows/_release.yml
    with:
      environment: dev
      project_id: ${{ vars.DEV_PROJECT_ID }}
      deployer_sa: ${{ vars.DEV_DEPLOYER_SA }}
      image: ${{ needs.build.outputs.image }}
      version: ${{ needs.build.outputs.version }}
      strategy: ${{ inputs.target == 'dev' && inputs.strategy || 'direct' }}
      canary_steps: ${{ inputs.canary_steps || '10 50 100' }}
      error_rate: ${{ inputs.target == 'dev' && inputs.error_rate || '0' }}

  prod:
    needs: [build, dev]
    if: inputs.target != 'dev'
    uses: ./.github/workflows/_release.yml
    with:
      environment: prod
      project_id: ${{ vars.PROD_PROJECT_ID }}
      deployer_sa: ${{ vars.PROD_DEPLOYER_SA }}
      image: ${{ needs.build.outputs.image }}
      version: ${{ needs.build.outputs.version }}
      strategy: ${{ inputs.strategy || 'canary' }}
      canary_steps: ${{ inputs.canary_steps || '10 50 100' }}
      error_rate: ${{ inputs.error_rate || '0' }}

  # Every prod release becomes a GitHub Release: what shipped, from which PRs,
  # with its provenance. Release tags are protected, so one can't be rewritten.
  publish:
    needs: [build, prod]
    if: needs.prod.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.build.outputs.image }}
          REVISION: ${{ needs.prod.outputs.revision }}
        run: |
          tag="release-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "Released to **prod** by canary, with the prod approval recorded in [run ${GITHUB_RUN_ID}](${run_url})."
            echo
            echo "- Revision: \`${REVISION}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Verify its build provenance: \`gh attestation verify oci://${IMAGE} --repo ${GITHUB_REPOSITORY}\`"
          } > notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes-file notes.md --generate-notes --latest
