name: Rollback

# Instantly send 100% of traffic back to the revision tagged "previous".
# No rebuild: the old revision is still deployed, so this takes seconds.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [prod, dev]
        default: prod

permissions:
  contents: read
  id-token: write
  actions: write # to stop a release that's in flight

# Rollback never queues behind a release (one parked at the prod approval gate
# would otherwise hold it): it has its own group, and stops releases first.
concurrency:
  group: rollback-${{ inputs.environment }}
  cancel-in-progress: false

env:
  CLOUDSDK_CORE_PROJECT: ${{ inputs.environment == 'dev' && vars.DEV_PROJECT_ID || vars.PROD_PROJECT_ID }}
  DEPLOYER_SA: ${{ inputs.environment == 'dev' && vars.DEV_DEPLOYER_SA || vars.PROD_DEPLOYER_SA }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: hello-web
  JOB: hello-web-maintenance

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      # An in-flight Deploy could keep shifting traffic after we roll back.
      - name: Stop any release in progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for status in in_progress waiting queued pending; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --status "$status" --json databaseId -q '.[].databaseId'
          done | sort -u | while read -r id; do
            echo "Stopping Deploy run $id"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done

      - name: Roll back
        run: |
          svc=$(gcloud run services describe "$SERVICE" --region "$REGION" --format json)
          prev=$(jq -r '.status.traffic[] | select(.tag == "previous") | .revisionName' <<<"$svc")
          [ -n "$prev" ] || { echo "::error::No revision tagged 'previous'"; exit 1; }
          echo "Sending 100% to $prev"
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "$prev=100" --quiet
          sleep 15
          scripts/verify.sh "$(jq -r '.status.url' <<<"$svc")" 50 1

      - name: Summary
        if: always()
        run: |
          { echo '```'; scripts/traffic.sh "$SERVICE" "$REGION"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
