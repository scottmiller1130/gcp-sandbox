version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories: [/terraform/bootstrap, /terraform/platform, /terraform/envs/*, /terraform/modules/*, /labs/*]
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
