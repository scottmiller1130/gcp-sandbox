name: Promote

# Blue/green cutover: send 100% of traffic to the "green" revision left by a
# blue-green deploy. The old revision stays tagged "previous" for Rollback.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [prod, dev]
        default: prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

env:
  CLOUDSDK_CORE_PROJECT: ${{ inputs.environment == 'dev' && vars.DEV_PROJECT_ID || vars.PROD_PROJECT_ID }}
  DEPLOYER_SA: ${{ inputs.environment == 'dev' && vars.DEV_DEPLOYER_SA || vars.PROD_DEPLOYER_SA }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: hello-web
  JOB: hello-web-maintenance

jobs:
  promote:
    runs-on: ubuntu-latest
    # Cutting prod over is a prod change: it waits for the `prod` reviewer.
    environment: ${{ inputs.environment }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Find blue and green
        id: find
        run: |
          svc=$(gcloud run services describe "$SERVICE" --region "$REGION" --format json)
          green=$(jq -r '.status.traffic[] | select(.tag == "green") | .revisionName' <<<"$svc")
          green_url=$(jq -r '.status.traffic[] | select(.tag == "green") | .url' <<<"$svc")
          blue=$(jq -r '[.status.traffic[] | select(.percent > 0)] | max_by(.percent) | .revisionName' <<<"$svc")
          [ -n "$green" ] || { echo "::error::No green revision - run Deploy with strategy blue-green first"; exit 1; }
          [ "$green" != "$blue" ] || { echo "::error::$green is already serving production"; exit 1; }
          echo "Blue: $blue  Green: $green"
          {
            echo "green=$green"
            echo "green_url=$green_url"
            echo "blue=$blue"
            echo "url=$(jq -r '.status.url' <<<"$svc")"
          } >> "$GITHUB_OUTPUT"

      - name: Final check on green
        run: scripts/verify.sh "${{ steps.find.outputs.green_url }}" 50 1

      - name: Cut over
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --update-tags "previous=${{ steps.find.outputs.blue }}" \
            --remove-tags green \
            --to-revisions "${{ steps.find.outputs.green }}=100" --quiet
          sleep 15
          scripts/verify.sh "${{ steps.find.outputs.url }}" 100 1

      - name: Point the maintenance job at green's image
        continue-on-error: true
        run: |
          image=$(gcloud run revisions describe "${{ steps.find.outputs.green }}" --region "$REGION" \
            --format 'value(spec.containers[0].image)')
          gcloud run jobs update "$JOB" --region "$REGION" --image "$image" --quiet

      - name: Switch back to blue on failure
        if: failure() && steps.find.outcome == 'success'
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${{ steps.find.outputs.blue }}=100" --quiet

      - name: Summary
        if: always()
        run: |
          { echo '```'; scripts/traffic.sh "$SERVICE" "$REGION"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
