name: Release (reusable)

# Releases an already-built image to one environment. Called by Deploy for
# dev and then prod, so both run exactly the same steps and gates.
#
#   candidate at 0%  ->  smoke test  ->  canary | blue-green | direct
#   any failed gate  ->  100% back to the previous revision
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      project_id:
        type: string
        required: true
      deployer_sa:
        type: string
        required: true
      image:
        description: Image by digest
        type: string
        required: true
      version:
        type: string
        required: true
      strategy:
        type: string
        default: canary
      canary_steps:
        type: string
        default: "10 50 100"
      error_rate:
        type: string
        default: "0"
    outputs:
      revision:
        description: The revision this release created
        value: ${{ jobs.release.outputs.revision }}

permissions:
  contents: read
  id-token: write
  attestations: read
  pull-requests: read # the change ledger records the PR and its approvals
  actions: read       # ...and who approved the deployment

env:
  CLOUDSDK_CORE_PROJECT: ${{ inputs.project_id }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: hello-web
  JOB: hello-web-maintenance
  STRATEGY: ${{ inputs.strategy }}
  CANARY_STEPS: ${{ inputs.canary_steps }}
  ERROR_RATE: ${{ inputs.error_rate }}

jobs:
  release:
    name: ${{ inputs.environment }} (${{ inputs.strategy }})
    runs-on: ubuntu-latest
    # The `prod` environment waits for a required reviewer before this job
    # starts; the approval is recorded on the run.
    environment: ${{ inputs.environment }}
    outputs:
      revision: ${{ steps.candidate.outputs.revision }}
    # One release per environment at a time; never cancel one mid traffic shift.
    concurrency:
      group: release-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ inputs.deployer_sa }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      # Refuse anything this repository's Deploy workflow didn't build and sign.
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          gh attestation verify "oci://${{ inputs.image }}" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/deploy.yml"

      - name: Record the revision currently serving traffic
        id: current
        run: |
          svc=$(gcloud run services describe "$SERVICE" --region "$REGION" --format json)
          rev=$(jq -r '[.status.traffic[] | select(.percent > 0)] | max_by(.percent) | .revisionName // empty' <<<"$svc")
          echo "Serving revision: ${rev:-none}"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.status.url' <<<"$svc")" >> "$GITHUB_OUTPUT"

      - name: Deploy candidate with no traffic
        id: candidate
        run: |
          suffix="${{ inputs.version }}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gcloud run deploy "$SERVICE" --region "$REGION" \
            --image "${{ inputs.image }}" \
            --revision-suffix "$suffix" \
            --update-env-vars "ERROR_RATE=$ERROR_RATE,APP_ENV=${{ inputs.environment }}" \
            --no-traffic --tag candidate --quiet
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          echo "revision=$SERVICE-$suffix" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Candidate $SERVICE-$suffix is live at $url"

      - name: Smoke test candidate on its private URL
        run: |
          curl -fsS --retry 3 "${{ steps.candidate.outputs.url }}/" -o /dev/null
          scripts/verify.sh "${{ steps.candidate.outputs.url }}" 50 20

      - name: Walk the customer journey on the candidate
        # Same walk as on pull requests, but against the real deployment, with
        # its database attached. Any failing step stops the release here, before
        # a single customer is sent to it.
        run: python3 scripts/journey.py check --url "${{ steps.candidate.outputs.url }}" --out journey.json --strict

      - name: Keep the old revision addressable for rollback
        if: steps.current.outputs.revision != ''
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --update-tags "previous=${{ steps.current.outputs.revision }}" --quiet

      - name: Canary rollout
        if: env.STRATEGY == 'canary'
        env:
          NEW: ${{ steps.candidate.outputs.revision }}
          URL: ${{ steps.current.outputs.url }}
        run: |
          for pct in $CANARY_STEPS; do
            echo "::group::$pct% to $NEW"
            gcloud run services update-traffic "$SERVICE" --region "$REGION" \
              --to-revisions "$NEW=$pct" --quiet
            sleep 15 # let the routing change settle
            if [ "$pct" -lt 100 ]; then
              # Judge the new revision on its own responses: <=5% errors.
              scripts/verify.sh "$URL" 300 5 "$NEW"
              sleep 30 # bake time before the next step
            else
              scripts/verify.sh "$URL" 100 1
            fi
            echo "::endgroup::"
          done

      - name: Blue/green - leave green ready for cutover
        if: env.STRATEGY == 'blue-green'
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --update-tags "green=${{ steps.candidate.outputs.revision }}" --quiet
          green_url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format json \
            | jq -r '.status.traffic[] | select(.tag == "green") | .url')
          {
            echo "### Green is ready in ${{ inputs.environment }}"
            echo "- Blue (100%): ${{ steps.current.outputs.url }}"
            echo "- Green (0%): $green_url"
            echo
            echo "Test green, then run the **Promote** workflow (environment: ${{ inputs.environment }})."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Direct rollout
        if: env.STRATEGY == 'direct'
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${{ steps.candidate.outputs.revision }}=100" --quiet
          sleep 15
          scripts/verify.sh "${{ steps.current.outputs.url }}" 100 1

      # Same binary, so the job always matches what the service runs. Not part
      # of the release gate: a failure here shouldn't roll back a healthy release.
      - name: Point the maintenance job at the new image
        if: env.STRATEGY != 'blue-green'
        continue-on-error: true
        run: gcloud run jobs update "$JOB" --region "$REGION" --image "${{ inputs.image }}" --quiet

      - name: Roll back on failure
        if: failure() && steps.candidate.outcome == 'success' && steps.current.outputs.revision != ''
        run: |
          echo "::error::Release failed - sending 100% back to ${{ steps.current.outputs.revision }}"
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${{ steps.current.outputs.revision }}=100" --quiet

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ inputs.environment }}: ${STRATEGY}"
            echo "- Image: \`${{ inputs.image }}\`"
            echo "- Candidate: \`${{ steps.candidate.outputs.revision }}\` (error_rate=$ERROR_RATE)"
            echo "- Previous: \`${{ steps.current.outputs.revision }}\`"
            echo "- URL: ${{ steps.current.outputs.url }}"
            echo
            echo '```'
            scripts/traffic.sh "$SERVICE" "$REGION" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record in the change ledger
        # A ledger problem is flagged on the run, but never fails a change that
        # already happened.
        continue-on-error: true
        if: always() && steps.candidate.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_BUCKET: ${{ vars.LEDGER_BUCKET }}
        run: |
          python3 scripts/ledger.py record --kind release --environment "${{ inputs.environment }}" \
            --outcome "${{ job.status }}" --detail "image=${{ inputs.image }}" \
            --detail "revision=${{ steps.candidate.outputs.revision }}" \
            --detail "previous_revision=${{ steps.current.outputs.revision }}" --detail "strategy=$STRATEGY"
