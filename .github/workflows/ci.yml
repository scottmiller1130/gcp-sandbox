name: CI

# Runs on every PR and push. Never authenticates to GCP, so PRs (including
# from forks) can't touch the cloud project.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: app/go.mod
          cache: false # no dependencies to cache
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "Run gofmt on: $unformatted"; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Container builds
        run: docker build -t app:ci .
      # Known vulnerabilities in the image (OS packages and the Go binary).
      # Fails on HIGH/CRITICAL with a fix available; every finding goes to the
      # Security tab.
      - name: Scan the image (Trivy)
        run: |
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.58.1 image --quiet "$@" app:ci; }
          trivy --format sarif --output /out/trivy.sarif
          trivy --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Upload image findings
        if: always() && hashFiles('app/trivy.sarif') != ''
        continue-on-error: true # read-only token on fork PRs
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: app/trivy.sarif
          category: trivy-image

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck scripts/*.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements-tf-risk.txt
      - name: Risk engine, customer journey and cost tests
        run: python -W error::ResourceWarning -m unittest -v scripts/test_tf_risk.py scripts/test_journey.py scripts/test_cost.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
      - run: terraform fmt -check -recursive
      - name: Validate every root and module
        run: |
          for dir in terraform/bootstrap terraform/platform terraform/envs/*/ terraform/modules/*/ labs/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: tflint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=warning

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the latest
      # Secrets in any commit. Fails the check; GitHub's push protection is the
      # first line, this is the second.
      - name: Secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo \
            --redact --no-banner --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Terraform misconfigurations. Reported to the Security tab, not blocking:
      # some findings (customer-managed keys, versioning everywhere) are
      # deliberate trade-offs for the free tier, documented in docs/security.md.
      - name: Terraform (checkov)
        run: |
          pip install --quiet "checkov>=3.2,<4"
          checkov -d terraform -d labs --framework terraform --quiet --soft-fail \
            --output sarif --output-file-path .
      - name: Upload findings
        if: always()
        continue-on-error: true # read-only token on fork PRs
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: .
          category: repo-scanners

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Blocks a PR that adds a dependency with a known moderate+ vulnerability
      # or a license that isn't allowed.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0-only, AGPL-3.0-only
