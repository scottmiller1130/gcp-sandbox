name: Load test

# Runs k6 from a GitHub runner against the live service, then reads Cloud
# Monitoring to report how many instances Cloud Run scaled to.
#
# Cost: a default run is ~25k requests and a few hundred vCPU-seconds, far
# inside Cloud Run's free tier (2M requests, 180k vCPU-seconds per month).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [prod, dev]
        default: prod
      vus:
        description: Concurrent virtual users (max 200)
        default: "50"
      duration:
        description: Time at full load, e.g. 2m (max 10m)
        default: "2m"
      path:
        description: Path to hit. /work?ms=N holds each request N ms (max 1000) to force scaling.
        default: "/work?ms=200"
      target:
        description: Which URL to test
        type: choice
        options: [production, candidate]
        default: production

permissions:
  contents: read
  id-token: write

env:
  CLOUDSDK_CORE_PROJECT: ${{ inputs.environment == 'dev' && vars.DEV_PROJECT_ID || vars.PROD_PROJECT_ID }}
  DEPLOYER_SA: ${{ inputs.environment == 'dev' && vars.DEV_DEPLOYER_SA || vars.PROD_DEPLOYER_SA }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: hello-web
  JOB: hello-web-maintenance

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs
        env:
          DURATION: ${{ inputs.duration }}
        run: |
          [[ "$DURATION" =~ ^([1-9]|10)m$|^[0-9]{1,3}s$ ]] || { echo "::error::duration must be like 90s or 1m-10m"; exit 1; }

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve target URL
        id: url
        run: |
          svc=$(gcloud run services describe "$SERVICE" --region "$REGION" --format json)
          if [ "${{ inputs.target }}" = candidate ]; then
            url=$(jq -r '.status.traffic[] | select(.tag == "candidate") | .url' <<<"$svc")
          else
            url=$(jq -r '.status.url' <<<"$svc")
          fi
          [ -n "$url" ] || { echo "::error::no URL for ${{ inputs.target }}"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: grafana/setup-k6-action@v1

      - name: Run k6
        run: |
          k6 run --summary-export summary.json \
            -e BASE_URL="${{ steps.url.outputs.url }}" \
            -e TARGET_PATH="${{ inputs.path }}" \
            -e VUS="${{ inputs.vus }}" \
            -e DURATION="${{ inputs.duration }}" \
            loadtest/k6.js

      - name: Peak instance count (Cloud Monitoring)
        if: always() && steps.url.outcome == 'success'
        run: |
          echo "Waiting for metrics to land (Cloud Monitoring lags ~2-3 min)..."
          sleep 180
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          peak=$(curl -sfG "https://monitoring.googleapis.com/v3/projects/$CLOUDSDK_CORE_PROJECT/timeSeries" \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            --data-urlencode "filter=metric.type=\"run.googleapis.com/container/instance_count\" AND resource.labels.service_name=\"$SERVICE\"" \
            --data-urlencode "interval.startTime=${{ steps.url.outputs.start }}" \
            --data-urlencode "interval.endTime=$end" \
            --data-urlencode "aggregation.alignmentPeriod=60s" \
            --data-urlencode "aggregation.perSeriesAligner=ALIGN_MAX" \
            --data-urlencode "aggregation.crossSeriesReducer=REDUCE_SUM" \
            | jq '[.timeSeries[]?.points[]?.value.int64Value | tonumber] | max // 0')
          {
            echo "### Load test (${{ inputs.environment }}): ${{ inputs.vus }} VUs for ${{ inputs.duration }} on \`${{ inputs.path }}\`"
            echo "- Target: ${{ steps.url.outputs.url }}"
            echo "- **Peak instances: $peak**"
            if [ -f summary.json ]; then
              jq -r '"- Requests: \(.metrics.http_reqs.count) (\(.metrics.http_reqs.rate | floor)/s)",
                     "- Failed: \(.metrics.http_req_failed.value * 100 | . * 100 | floor / 100)%",
                     "- Latency p50 / p95 / p99: \(.metrics.http_req_duration["p(50)"] | floor) / \(.metrics.http_req_duration["p(95)"] | floor) / \(.metrics.http_req_duration["p(99)"] | floor) ms"' summary.json
            fi
            echo
            echo "[Cloud Run metrics](https://console.cloud.google.com/run/detail/$REGION/$SERVICE/metrics?project=$CLOUDSDK_CORE_PROJECT)"
          } >> "$GITHUB_STEP_SUMMARY"
