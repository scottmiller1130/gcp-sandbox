name: CI

# Runs on every PR and push. Never authenticates to GCP, so PRs (including
# from forks) can't touch the cloud project.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: false # no dependencies to cache
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "Run gofmt on: $unformatted"; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Container builds
        run: docker build -t app:ci .

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements-tf-risk.txt
      - name: Risk engine tests
        run: python -W error::ResourceWarning -m unittest -v scripts/test_tf_risk.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: terraform-linters/setup-tflint@v4
      - run: terraform fmt -check -recursive
      - name: Validate every root and module
        run: |
          for dir in terraform/bootstrap terraform/platform terraform/envs/*/ terraform/modules/*/ labs/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: tflint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=warning
