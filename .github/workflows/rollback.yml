name: Rollback

# Instantly send 100% of traffic back to the revision tagged "previous".
# No rebuild: the old revision is still deployed, so this takes seconds.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [prod, dev]
        default: prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

env:
  CLOUDSDK_CORE_PROJECT: ${{ inputs.environment == 'dev' && vars.DEV_PROJECT_ID || vars.PROD_PROJECT_ID }}
  DEPLOYER_SA: ${{ inputs.environment == 'dev' && vars.DEV_DEPLOYER_SA || vars.PROD_DEPLOYER_SA }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: hello-web
  JOB: hello-web-maintenance

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Roll back
        run: |
          svc=$(gcloud run services describe "$SERVICE" --region "$REGION" --format json)
          prev=$(jq -r '.status.traffic[] | select(.tag == "previous") | .revisionName' <<<"$svc")
          [ -n "$prev" ] || { echo "::error::No revision tagged 'previous'"; exit 1; }
          echo "Sending 100% to $prev"
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "$prev=100" --quiet
          sleep 15
          scripts/verify.sh "$(jq -r '.status.url' <<<"$svc")" 50 1

      - name: Summary
        if: always()
        run: |
          { echo '```'; scripts/traffic.sh "$SERVICE" "$REGION"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
